name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: '24.04'
            suite: noble
          - ubuntu: '26.04'
            suite: resolute
    container:
      image: ubuntu:${{ matrix.ubuntu }}
      options: --cpus 2 --memory 3g --init
    name: Ubuntu ${{ matrix.ubuntu }}
    steps:
      - name: Install bootstrap dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git dpkg-dev python3-debian
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Configure target and install build dependencies
        run: |
          /usr/bin/python3 scripts/debian_target.py configure --suite ${{ matrix.suite }}
          DEBIAN_FRONTEND=noninteractive apt-get build-dep -y --no-install-recommends .
          useradd --create-home --uid 1001 builder
          chown -R builder:builder "$(dirname "$GITHUB_WORKSPACE")"
      - name: Build Debian package and run native checks
        run: runuser -u builder -- dpkg-buildpackage -b -us -uc
      - name: Record checked binaries
        run: runuser -u builder -- /usr/bin/python3 scripts/release_binaries.py --suite ${{ matrix.suite }} --output dist/checked
      - name: Retain checked binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: binary-${{ matrix.suite }}
          path: dist/checked/
          if-no-files-found: error
