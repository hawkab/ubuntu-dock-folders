name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: '24.04'
            dock: gnome-shell-extension-ubuntu-dock
          - ubuntu: '26.04'
            dock: gnome-shell-ubuntu-extensions
    container:
      image: ubuntu:${{ matrix.ubuntu }}
      options: --cpus 2 --memory 2g
    name: Ubuntu ${{ matrix.ubuntu }}
    timeout-minutes: 15
    env:
      GSETTINGS_BACKEND: memory
      GSK_RENDERER: cairo
      GDK_DEBUG: no-portals
      GTK_A11Y: none
      ADW_DISABLE_PORTAL: '1'
    steps:
      - name: Install build dependencies
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential dpkg-dev ca-certificates pkg-config gettext libglib2.0-dev librsvg2-common gnome-shell ${{ matrix.dock }} gnome-control-center dconf-cli libgtk-4-1 libadwaita-1-0 python3-gi python3-pil python3-yaml python3-paramiko python3-cairo python3-gi-cairo gir1.2-gtk-4.0 gir1.2-gdkpixbuf-2.0 gir1.2-adw-1 xvfb xauth xwayland locales-all git gnupg appstream appstream-compose desktop-file-utils dbus-daemon
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build extension and Ubuntu package
        run: make build
      - name: Run checks
        run: dbus-run-session -- xvfb-run -a make check
        timeout-minutes: 3
      - name: Validate package metadata
        run: |
          appstreamcli validate --no-net build/package/usr/share/metainfo/*.metainfo.xml
          desktop-file-validate build/package/usr/share/applications/*.desktop
      - name: Test extension in GNOME Shell
        run: /usr/bin/python3 scripts/test_shell.py
        timeout-minutes: 2
      - name: Test Xwayland applications
        run: xvfb-run -a /usr/bin/python3 scripts/test_shell.py --client-backend x11
        timeout-minutes: 2
      - name: Test X11 session
        if: matrix.ubuntu == '24.04'
        run: xvfb-run -a /usr/bin/python3 scripts/test_shell.py --backend x11
        timeout-minutes: 2
