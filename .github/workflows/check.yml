name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      APT_CONFIG: /tmp/ubuntu-dock-folders-apt.conf
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: '24.04'
            suite: noble
          - ubuntu: '26.04'
            suite: resolute
    container:
      image: ubuntu:${{ matrix.ubuntu }}
      options: --cpus 2 --memory 3g --init
    name: Ubuntu ${{ matrix.ubuntu }}
    steps:
      - name: Install bootstrap dependencies
        run: |
          . /etc/os-release
          mirror=https://azure.archive.ubuntu.com/ubuntu/
          if [ ! -s /etc/ssl/certs/ca-certificates.crt ]; then
            mirror=http://azure.archive.ubuntu.com/ubuntu/
          fi
          cat > "$APT_CONFIG.sources" <<EOF
          Types: deb
          URIs: $mirror
          Suites: $VERSION_CODENAME $VERSION_CODENAME-updates $VERSION_CODENAME-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          cat > "$APT_CONFIG" <<EOF
          Dir::Etc::sourcelist "$APT_CONFIG.sources";
          Dir::Etc::sourceparts "-";
          APT::Update::Error-Mode "any";
          Acquire::ForceIPv4 "true";
          EOF
          cat > "$APT_CONFIG.retry" <<'APT_RETRY'
          #!/bin/sh
          set -u
          export LC_ALL=C DEBIAN_FRONTEND=noninteractive
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          delay=5
          while :; do
            if apt-get "$@" > "$log" 2>&1; then
              cat "$log"
              exit 0
            else
              status=$?
            fi
            cat "$log"
            if ! awk '
              /^E: Failed to fetch / {
                if ($0 ~ /(Temporary failure resolving|Could not resolve|Could not connect|Unable to connect|Connection (failed|timed out|reset|refused)|Network is unreachable|Error reading from server|50[0234] (Internal Server Error|Bad Gateway|Service Unavailable|Gateway Time-out)|429 Too Many Requests)/)
                  transient = 1
                else
                  permanent = 1
                next
              }
              /^E: (Some index files failed to download|Unable to fetch some archives)/ { next }
              /^E:/ { permanent = 1 }
              END { exit permanent || !transient }
            ' "$log"; then
              exit "$status"
            fi
            echo "APT network unavailable; retrying in ${delay}s"
            sleep "$delay"
            delay=$((delay * 2))
            if [ "$delay" -gt 300 ]; then delay=300; fi
          done
          APT_RETRY
          chmod 700 "$APT_CONFIG.retry"
          until getent ahostsv4 azure.archive.ubuntu.com; do
            echo "Waiting for Ubuntu mirror DNS resolution"
            sleep 30
          done
          "$APT_CONFIG.retry" update
          "$APT_CONFIG.retry" install -y --no-install-recommends ca-certificates git dpkg-dev python3-debian
          sed -i 's|http://azure.archive.ubuntu.com|https://azure.archive.ubuntu.com|' "$APT_CONFIG.sources"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Configure target and install build dependencies
        run: |
          /usr/bin/python3 scripts/debian_target.py configure --suite ${{ matrix.suite }}
          "$APT_CONFIG.retry" build-dep -y --no-install-recommends .
          useradd --create-home --uid 1001 builder
          chown -R builder:builder "$(dirname "$GITHUB_WORKSPACE")"
      - name: Build Debian package and run native checks
        run: runuser -u builder -- dpkg-buildpackage -b -us -uc
      - name: Record checked binaries
        run: runuser -u builder -- /usr/bin/python3 scripts/release_binaries.py --suite ${{ matrix.suite }} --output dist/checked
      - name: Retain checked binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: binary-${{ matrix.suite }}
          path: dist/checked/
          if-no-files-found: error
