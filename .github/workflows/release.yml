name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or resume
        required: true
        type: string
      checked_run:
        description: Successful Check run for this tag, to resume publication
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ !inputs.checked_run && (github.event_name != 'push' || github.event.deleted != true) }}
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  publish:
    needs: validate
    if: ${{ always() && (needs.validate.result == 'success' || (needs.validate.result == 'skipped' && inputs.checked_run)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: release
    steps:
      - name: Check out publisher
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: publisher
          fetch-depth: 0
          persist-credentials: false
      - name: Check out release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential devscripts dput git gnupg python3-debian
          mkdir -p "$RUNNER_TEMP/build-dependencies"
          cp -a source/debian source/scripts source/packaging "$RUNNER_TEMP/build-dependencies/"
          cd "$RUNNER_TEMP/build-dependencies"
          /usr/bin/python3 scripts/debian_target.py configure
          sudo apt-get build-dep -y --no-install-recommends .
      - name: Verify reused checks
        if: ${{ inputs.checked_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED_RUN: ${{ inputs.checked_run }}
        run: /usr/bin/python3 publisher/scripts/release_binaries.py --verify-run "$CHECKED_RUN" --repository "$GITHUB_REPOSITORY" --commit "$(git -C source rev-parse HEAD)"
      - name: Load publishing keys
        env:
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
          LAUNCHPAD_UPLOAD_KEY: ${{ secrets.LAUNCHPAD_UPLOAD_KEY }}
          APT_DEPLOY_KEY: ${{ secrets.APT_DEPLOY_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/release-gnupg"
          printf '%s' "$RELEASE_GPG_KEY" | gpg --homedir "$RUNNER_TEMP/release-gnupg" --batch --import
          printf '%s\n' 'D4FE96494637320FCA25DD35E94D1A6D97CE2319:6:' | gpg --homedir "$RUNNER_TEMP/release-gnupg" --import-ownertrust
          printf '%s\n' "$LAUNCHPAD_UPLOAD_KEY" > "$RUNNER_TEMP/launchpad-upload"
          printf '%s\n' "$APT_DEPLOY_KEY" > "$RUNNER_TEMP/apt-deploy"
      - name: Download checked binaries
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED_RUN: ${{ inputs.checked_run || github.run_id }}
        run: gh run download "$CHECKED_RUN" --repo "$GITHUB_REPOSITORY" --pattern 'binary-*' --dir "$RUNNER_TEMP/checked-binaries"
      - name: Build, test and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GNUPGHOME: ${{ runner.temp }}/release-gnupg
          LAUNCHPAD_UPLOAD_TRANSPORT: sftp
          LAUNCHPAD_SSH_KEY: ${{ runner.temp }}/launchpad-upload
          APT_DEPLOY_KEY: ${{ runner.temp }}/apt-deploy
        run: /usr/bin/python3 publisher/scripts/release.py --source-root "$GITHUB_WORKSPACE/source" --binaries "$RUNNER_TEMP/checked-binaries" --publish --wait-seconds 3600
      - name: Retain release artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-release
          path: source/dist/releases/
          if-no-files-found: ignore
      - name: Remove publishing keys
        if: always()
        run: |
          gpgconf --homedir "$RUNNER_TEMP/release-gnupg" --kill all || true
          rm -rf "$RUNNER_TEMP/release-gnupg" "$RUNNER_TEMP/launchpad-upload" "$RUNNER_TEMP/apt-deploy"
