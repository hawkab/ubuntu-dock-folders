name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or resume
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential debhelper devscripts dput apt-utils appstream appstream-compose desktop-file-utils gettext libglib2.0-dev librsvg2-common pkg-config gnome-shell gnome-shell-extension-ubuntu-dock libgtk-4-1 libadwaita-1-0 python3-gi python3-pil python3-cairo python3-gi-cairo python3-yaml gir1.2-gtk-4.0 gir1.2-gdkpixbuf-2.0 gir1.2-adw-1 nodejs dbus-daemon xvfb xauth
      - name: Load publishing keys
        env:
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
          LAUNCHPAD_UPLOAD_KEY: ${{ secrets.LAUNCHPAD_UPLOAD_KEY }}
          APT_DEPLOY_KEY: ${{ secrets.APT_DEPLOY_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/release-gnupg"
          printf '%s' "$RELEASE_GPG_KEY" | gpg --homedir "$RUNNER_TEMP/release-gnupg" --batch --import
          printf '%s\n' "$LAUNCHPAD_UPLOAD_KEY" > "$RUNNER_TEMP/launchpad-upload"
          printf '%s\n' "$APT_DEPLOY_KEY" > "$RUNNER_TEMP/apt-deploy"
      - name: Build, test and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GNUPGHOME: ${{ runner.temp }}/release-gnupg
          LAUNCHPAD_SSH_KEY: ${{ runner.temp }}/launchpad-upload
          APT_DEPLOY_KEY: ${{ runner.temp }}/apt-deploy
        run: python3 scripts/release.py --publish
      - name: Retain release artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-release
          path: dist/releases/
          if-no-files-found: ignore
      - name: Remove publishing keys
        if: always()
        run: |
          gpgconf --homedir "$RUNNER_TEMP/release-gnupg" --kill all || true
          rm -rf "$RUNNER_TEMP/release-gnupg" "$RUNNER_TEMP/launchpad-upload" "$RUNNER_TEMP/apt-deploy"
